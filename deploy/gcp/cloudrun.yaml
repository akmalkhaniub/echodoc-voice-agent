# ==============================================================================
# Google Cloud Run Service Specification
# Docs: https://cloud.google.com/run/docs/reference/rest/v2/projects.locations.services
# ==============================================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: echodoc-voice-agent
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "Sub-Second Clinical Voice Scribe on Google Cloud Run"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
        # 60 minute session timeout for continuous clinical dictation streaming
        run.googleapis.com/timeoutSeconds: "3600"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 3600
      containers:
        - image: gcr.io/PROJECT_ID/echodoc-voice-agent:latest
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: MOCK_STREAMING
              value: "false"
          # Secret Manager integration for AssemblyAI API Key
          # env:
          #   - name: ASSEMBLYAI_API_KEY
          #     valueFrom:
          #       secretKeyRef:
          #         name: assemblyai-api-key
          #         key: latest
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
