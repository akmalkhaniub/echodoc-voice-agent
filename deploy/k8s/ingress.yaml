apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voxdive-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Essential annotations for long-lived voice-agent audio WebSocket connections
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "voxdive-service"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - voxdive.example.com
      secretName: voxdive-tls-cert
  rules:
    - host: voxdive.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: voxdive-service
                port:
                  number: 80
