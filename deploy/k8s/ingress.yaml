apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echodoc-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Essential annotations for long-lived clinical audio WebSocket connections
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "echodoc-service"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - echodoc.example.com
      secretName: echodoc-tls-cert
  rules:
    - host: echodoc.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echodoc-service
                port:
                  number: 80
