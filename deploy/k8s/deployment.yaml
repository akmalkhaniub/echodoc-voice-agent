apiVersion: apps/v1
kind: Deployment
metadata:
  name: echodoc-voice-agent
  labels:
    app: echodoc-voice-agent
    part-of: clinical-suite
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: echodoc-voice-agent
  template:
    metadata:
      labels:
        app: echodoc-voice-agent
    spec:
      containers:
        - name: echodoc-voice-agent
          image: echodoc-voice-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: echodoc-config
          env:
            - name: ASSEMBLYAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: echodoc-secrets
                  key: assemblyai-api-key
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
